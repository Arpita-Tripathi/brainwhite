        run: |
          echo "TODO: deploy image ${{ github.sha }} to staging"
          echo "TODO: run database migrations before starting the new version"
          echo "TODO: smoke test GET /health"
          exit 1

  deploy-production:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
